apiVersion: v1
kind: Namespace
metadata:
  name: fleetoptimiser-loadtest
  labels:
    fleetoptimiser-lab/owner: local
    fleetoptimiser-lab/mesh: enabled
    # k6 runs with a sidecar so its requests reach the backend over mTLS as
    # cluster.local/ns/fleetoptimiser-loadtest/sa/k6. Native sidecars let the
    # Jobs complete when k6 exits.
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6
  namespace: fleetoptimiser-loadtest
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetoptimiser-k6-script
  namespace: fleetoptimiser-loadtest
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    const base = __ENV.TARGET_URL || 'http://fleetoptimiser-backend.fleetoptimiser.svc.cluster.local:3001';
    const level = __ENV.LOAD_LEVEL || 'baseline';

    export const options = {
      tags: {
        loadtest: 'fleetoptimiser',
        load_level: level,
      },
      thresholds: {
        http_req_failed: ['rate<0.05'],
        'http_req_duration{endpoint:readyz}': ['p(95)<1000'],
      },
    };

    export default function () {
      const endpoints = [
        ['healthz', '/healthz'],
        ['readyz', '/readyz'],
        ['simulation-configurations', '/configuration/simulation-configurations'],
        ['locations', '/simulation-setup/locations'],
        ['kpis', '/statistics/kpis'],
        ['simulation-history', '/fleet-simulation/simulation-history'],
        ['latest-highlights', '/fleet-simulation/highlights/latest'],
        ['allowed-locations', '/locations/location'],
        ['location-precision', '/locations/precision'],
        ['workshop-settings', '/workshops/settings'],
        ['workshops', '/workshops/workshop'],
        ['workshop-visits', '/workshops/visits'],
      ];

      for (const [endpoint, path] of endpoints) {
        const response = http.get(`${base}${path}`, { tags: { endpoint } });
        check(response, { [`${endpoint} is 200`]: (r) => r.status === 200 });
      }

      sleep(0.25);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fleetoptimiser-loadtest-baseline
  namespace: fleetoptimiser-loadtest
  labels:
    app.kubernetes.io/name: fleetoptimiser-loadtest
    app.kubernetes.io/component: loadtest
    load_level: baseline
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetoptimiser-loadtest
        app.kubernetes.io/component: loadtest
        load_level: baseline
    spec:
      restartPolicy: Never
      serviceAccountName: k6
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: [run, --vus, '5', --duration, 2m, --out, experimental-prometheus-rw, /scripts/script.js]
          env:
            - {name: K6_PROMETHEUS_RW_SERVER_URL, value: http://lab-monitoring-prometheus.monitoring.svc.cluster.local:9090/api/v1/write}
            - {name: K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM, value: 'false'}
            - {name: TARGET_URL, value: http://fleetoptimiser-backend.fleetoptimiser.svc.cluster.local:3001}
            - {name: LOAD_LEVEL, value: baseline}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
      volumes:
        - name: script
          configMap: {name: fleetoptimiser-k6-script}
---
