apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-client
  namespace: fleetoptimiser-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: fleetoptimiser-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ['-listen=:5678', '-text=fleetoptimiser-lab-ok']
          ports:
            - {name: http, containerPort: 5678}
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: fleetoptimiser-lab
spec:
  selector: {app: echo}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-client
  namespace: fleetoptimiser-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: mesh-client}
  template:
    metadata:
      labels: {app: mesh-client}
    spec:
      serviceAccountName: mesh-client
      containers:
        - name: curl
          image: curlimages/curl:8.12.1
          command: [sleep, infinity]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-client
  namespace: fleetoptimiser-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: plain-client}
  template:
    metadata:
      labels:
        app: plain-client
        sidecar.istio.io/inject: 'false'
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.12.1
          command: [sleep, infinity]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: require-mtls
  namespace: fleetoptimiser-lab
spec:
  mtls: {mode: STRICT}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: echo-from-mesh-client
  namespace: fleetoptimiser-lab
spec:
  selector:
    matchLabels: {app: echo}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ['cluster.local/ns/fleetoptimiser-lab/sa/mesh-client']
      to:
        - operation: {methods: [GET], ports: ['5678']}
