fullnameOverride: lab-alloy
# API-based log collection: one collector, no hostPath mounts or duplicate tails.
controller:
  type: deployment
  replicas: 1
alloy:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["fleetoptimiser", "fleetoptimiser-lab", "istio-system", "monitoring"]
        }
      }
      discovery.relabel "logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
      }
      loki.source.kubernetes "pods" {
        targets = discovery.relabel.logs.output
        forward_to = [loki.write.local.receiver]
      }
      loki.write "local" {
        endpoint {
          url = "http://lab-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
